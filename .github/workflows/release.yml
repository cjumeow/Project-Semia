name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # A tag that disagrees with the manifest ships a zip Chrome will label
      # with the wrong version, so refuse to build it.
      - name: Check tag matches manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(jq -r .version apps/extension/manifest.json)
          MANIFEST_NAME=$(jq -r .version_name apps/extension/manifest.json)
          PACKAGE_VERSION=$(jq -r .version apps/extension/package.json)

          FAILED=0
          for pair in \
            "manifest.json version:$MANIFEST_VERSION" \
            "manifest.json version_name:$MANIFEST_NAME" \
            "extension package.json version:$PACKAGE_VERSION"; do
            LABEL="${pair%%:*}"
            FOUND="${pair##*:}"
            if [ "$FOUND" != "$VERSION" ]; then
              echo "::error::$LABEL is $FOUND but tag is $GITHUB_REF_NAME"
              FAILED=1
            fi
          done
          exit $FAILED

      - run: npm ci

      - name: Verify
        run: npm run verify

      - name: Package extension
        run: |
          cd apps/extension
          zip -r "../../semia-extension-${GITHUB_REF_NAME}.zip" \
            manifest.json options.html dist/

      # Annotated tags carry hand-written notes, read over the API because
      # actions/checkout rewrites refs/tags/<tag> to point at the commit,
      # which loses the tag object locally. Lightweight tags have no message,
      # so those fall back to GitHub's generated commit list.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="semia-extension-${GITHUB_REF_NAME}.zip"
          REF=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          NOTES=""
          if [ "$(jq -r .object.type <<<"$REF")" = "tag" ]; then
            NOTES=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$REF")" --jq .message)
          fi

          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "$GITHUB_REF_NAME" \
              --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
